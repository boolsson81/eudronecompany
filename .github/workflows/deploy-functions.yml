name: Deploy edge functions

# Deployar EU Drone Companys edge functions till det Supabase-projekt som delas
# med DigitalSignal.
#
# Kräver EN hemlighet: SUPABASE_ACCESS_TOKEN, i det HÄR repots
# Actions-inställningar. Hemligheter delas inte mellan repon — att den finns i
# digitalsignal räcker inte, den måste sättas här också.
#
# Projekt-referensen är däremot ingen hemlighet. Den står i klartext i
# digitalsignals egna workflows, i dokumentationen och i Supabase-integrationens
# länkar på GitHub. Att kräva den som hemlighet gjorde bara att utrullningen föll
# på en tom variabel. Den är därför inbakad, med hemligheten som frivillig
# överstyrning om projektet någon gång byts.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      function:
        description: "Deploya bara en funktion (tomt = alla)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'jzqgwsryxmgzcbjjddic' }}
          ONLY: ${{ inputs.function }}
        run: |
          set -euo pipefail

          # Utan token faller supabase-cli med "Access token not provided", vilket
          # inte säger var den ska sättas. Säg det i stället.
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN saknas i det här repots Actions-hemligheter." \
                 "Sätt den under Settings → Secrets and variables → Actions →" \
                 "New repository secret. Hemligheten i digitalsignal gäller inte här."
            exit 1
          fi

          if [ -n "${ONLY:-}" ]; then
            supabase functions deploy "$ONLY" --project-ref "$PROJECT_REF"
            exit 0
          fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
