name: Deploy edge functions

# Deployar EU Drone Companys edge functions till det Supabase-projekt som delas
# med DigitalSignal. Kräver hemligheterna SUPABASE_ACCESS_TOKEN och
# SUPABASE_PROJECT_REF i repots Actions-inställningar.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      function:
        description: "Deploya bara en funktion (tomt = alla)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ONLY: ${{ inputs.function }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY:-}" ]; then
            supabase functions deploy "$ONLY" --project-ref "$PROJECT_REF"
            exit 0
          fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
